<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1c2c">
<title>Starter Party Controller</title>
<style>
  :root { --player: #8b9bb4; --bg: #1a1c2c; --fg: #f4f4f4; }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
      font-family: system-ui, sans-serif; touch-action: none; overscroll-behavior: none; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: block; }

  #join.on { display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 16px; text-align: center; }
  #join h1 { margin: 0; font-size: 24px; }
  #code { width: 6em; padding: 8px; border: 2px solid #566c86; border-radius: 10px; background: #000;
      color: var(--fg); font: 700 32px monospace; letter-spacing: 0.25em; text-align: center;
      text-transform: uppercase; -webkit-user-select: text; user-select: text; }
  #join-btn { padding: 12px 36px; border: 0; border-radius: 12px; background: #e8423f; color: #fff;
      font: 700 20px system-ui, sans-serif; }
  #msg { min-height: 1.3em; color: #f2c230; }

  #stick-zone { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; }
  #stick-base, #stick-knob { position: absolute; display: none; border-radius: 50%;
      pointer-events: none; transform: translate(-50%, -50%); }
  #stick-base { width: 140px; height: 140px; border: 3px solid var(--player); opacity: 0.6; }
  #stick-knob { width: 64px; height: 64px; background: var(--player); }

  #diamond { position: absolute; top: 50%; right: max(24px, env(safe-area-inset-right));
      width: 264px; height: 264px; transform: translateY(-50%); }
  .btn { position: absolute; width: 84px; height: 84px; display: flex; align-items: center;
      justify-content: center; border: 3px solid var(--player); border-radius: 50%;
      background: rgba(255, 255, 255, 0.06); font: 700 28px system-ui, sans-serif; }
  .btn.down { background: var(--player); color: var(--bg); }
  #btn-y { left: 90px; top: 0; }
  #btn-x { left: 0; top: 90px; }
  #btn-b { left: 180px; top: 90px; }
  #btn-a { left: 90px; top: 180px; }

  #hud { position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      font-size: 14px; opacity: 0.85; pointer-events: none; white-space: nowrap; }
  #rotate { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: var(--bg); font-size: 22px; }
  @media (orientation: portrait) { #rotate { display: flex; } }
</style>
</head>
<body>
<div id="join" class="screen on">
  <h1>Starter Party</h1>
  <div>Enter the code on the big screen</div>
  <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
  <button id="join-btn">Join</button>
  <div id="msg"></div>
</div>

<div id="pad" class="screen">
  <div id="stick-zone"></div>
  <div id="stick-base"></div>
  <div id="stick-knob"></div>
  <div id="diamond">
    <div class="btn" id="btn-y">Y</div>
    <div class="btn" id="btn-x">X</div>
    <div class="btn" id="btn-b">B</div>
    <div class="btn" id="btn-a">A</div>
  </div>
  <div id="hud"><span id="status">Connecting...</span> · <span id="ping">-- ms</span></div>
  <div id="rotate">Turn your phone sideways</div>
</div>

<script>
// ---------------------------------------------------------------- settings
const RELAY = "wss://barrelofmonkeys.cyberdetective.workers.dev"; // <- your relay address
const SEND_MS = 33;          // check for changes ~30 times a second
const KEEPALIVE_MS = 1000;   // always send at least once a second (also measures ping)
const MIN_PRESS_MS = 60;     // super-quick taps stay "down" this long so the game sees them
const DEADZONE = 0.12;
const STICK_RADIUS = 60;     // px of thumb travel for a full push

// ---------------------------------------------------------------- state
const $ = (id) => document.getElementById(id);
const state = { x: 0, y: 0, b: 0 };  // b bits: 1 move1, 2 move2, 4 move3, 8 confirm, 16 back
let ws = null, room = "", lastKey = "", lastSentAt = 0, retryTimer = 0, playerText = "";

// A stable id for this phone, so a dropped connection rejoins as the same player.
function makeId() {
  return Array.from(crypto.getRandomValues(new Uint8Array(10)), (n) => (n % 36).toString(36)).join("");
}
let phoneId = makeId();
try {
  phoneId = localStorage.getItem("sp-phone-id") || phoneId;
  localStorage.setItem("sp-phone-id", phoneId);
} catch (e) { /* private browsing: a fresh id each visit is fine */ }

const codeFromUrl = new URLSearchParams(location.search).get("r");
if (codeFromUrl) $("code").value = codeFromUrl.toUpperCase();

// ---------------------------------------------------------------- joining
$("join-btn").addEventListener("click", join);
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });

function join() {
  room = $("code").value.trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(room)) { $("msg").textContent = "Codes are 4 letters."; return; }
  $("code").blur();
  $("join").classList.remove("on");
  $("pad").classList.add("on");
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
  keepAwake();
  connect();
}

function backToJoin(text) {
  room = "";
  clearTimeout(retryTimer);
  $("pad").classList.remove("on");
  $("join").classList.add("on");
  $("msg").textContent = text;
}

async function keepAwake() {
  try { await navigator.wakeLock.request("screen"); } catch (e) { /* unsupported: fine */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !room) return;
  keepAwake();
  if (!ws) connect();
});

// ---------------------------------------------------------------- connection
function setStatus(text) { $("status").textContent = text; }

function connect() {
  clearTimeout(retryTimer);
  setStatus("Connecting...");
  ws = new WebSocket(`${RELAY}/phone?room=${room}&id=${phoneId}`);
  ws.onopen = () => { lastKey = ""; lastSentAt = 0; setStatus(playerText || "Connected"); };
  ws.onmessage = (e) => {
    let d;
    try { d = JSON.parse(e.data); } catch (err) { return; }
    if (d.slot) { playerText = `You are P${d.slot}`; setStatus(playerText); }
    if (d.color) document.documentElement.style.setProperty("--player", "#" + d.color);
    if (typeof d.pong === "number") $("ping").textContent = `${Date.now() - d.pong} ms`;
  };
  ws.onclose = (e) => {
    ws = null;
    if (!room) return;
    if (e.code === 4004) return backToJoin("No game with that code. Check the big screen.");
    if (e.code === 4005) return backToJoin("That game is full.");
    if (e.code === 4000) return setStatus("Controller opened in another tab.");
    setStatus(e.code === 4002 ? "Game closed. Waiting for it..." : "Connection lost. Reconnecting...");
    retryTimer = setTimeout(connect, 2000);
  };
}

// ---------------------------------------------------------------- sending
const round2 = (v) => Math.round(v * 100) / 100;

function flush() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const now = Date.now();
  const msg = { x: round2(state.x), y: round2(state.y), b: state.b };
  const key = `${msg.x},${msg.y},${msg.b}`;
  const keepalive = now - lastSentAt >= KEEPALIVE_MS;
  if (key === lastKey && !keepalive) return;
  if (keepalive) msg.p = now;  // the game echoes this back so we can show ping
  ws.send(JSON.stringify(msg));
  lastKey = key;
  lastSentAt = now;
}
setInterval(flush, SEND_MS);

// ---------------------------------------------------------------- joystick (appears under your thumb)
const zone = $("stick-zone"), base = $("stick-base"), knob = $("stick-knob");
let stickPointer = null, originX = 0, originY = 0;

zone.addEventListener("pointerdown", (e) => {
  if (stickPointer !== null) return;
  stickPointer = e.pointerId;
  zone.setPointerCapture(e.pointerId);
  originX = e.clientX;
  originY = e.clientY;
  for (const el of [base, knob]) {
    el.style.display = "block";
    el.style.left = originX + "px";
    el.style.top = originY + "px";
  }
  e.preventDefault();
});

zone.addEventListener("pointermove", (e) => {
  if (e.pointerId !== stickPointer) return;
  let dx = (e.clientX - originX) / STICK_RADIUS;
  let dy = (e.clientY - originY) / STICK_RADIUS;
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  knob.style.left = originX + dx * STICK_RADIUS + "px";
  knob.style.top = originY + dy * STICK_RADIUS + "px";
  const l = Math.min(len, 1);
  if (l < DEADZONE) { state.x = 0; state.y = 0; return; }
  const m = (l - DEADZONE) / (1 - DEADZONE);  // smooth start at the deadzone edge
  state.x = (dx / l) * m;
  state.y = (dy / l) * m;
});

function endStick(e) {
  if (e.pointerId !== stickPointer) return;
  stickPointer = null;
  state.x = 0;
  state.y = 0;
  base.style.display = "none";
  knob.style.display = "none";
}
zone.addEventListener("pointerup", endStick);
zone.addEventListener("pointercancel", endStick);

// ---------------------------------------------------------------- buttons (same layout as a gamepad)
const BITS = { a: 1 | 8, x: 2, y: 4, b: 16 };  // A = move 1 + confirm, X = move 2, Y = move 3, B = back
for (const [name, bit] of Object.entries(BITS)) {
  const el = $("btn-" + name);
  let pointer = null, downAt = 0;
  el.addEventListener("pointerdown", (e) => {
    if (pointer !== null) return;
    pointer = e.pointerId;
    el.setPointerCapture(e.pointerId);
    downAt = Date.now();
    state.b |= bit;
    el.classList.add("down");
    if (navigator.vibrate) navigator.vibrate(12);
    flush();
    e.preventDefault();
  });
  const release = (e) => {
    if (e.pointerId !== pointer) return;
    pointer = null;
    el.classList.remove("down");
    setTimeout(() => {
      if (pointer === null) { state.b &= ~bit; flush(); }
    }, Math.max(0, MIN_PRESS_MS - (Date.now() - downAt)));
  };
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
}

// ---------------------------------------------------------------- no zooming, scrolling or menus
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (e) => e.preventDefault());
document.addEventListener("contextmenu", (e) => e.preventDefault());
</script>
</body>
</html>
