<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#19332d">
<title>Poke Party Controller</title>
<style>
  :root { --player: #a8b5b2; --bg: #19332d; --fg: #ebede9; }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
      font-family: system-ui, sans-serif; touch-action: none; overscroll-behavior: none; }
  .screen { position: fixed; inset: 0; display: none; }
  /* No zoom of any kind on the controller: every touch belongs to the game.
     (manipulation still allows pinch-zoom, which two thumbs can trigger.) */
  #pad, #pad * { touch-action: none; }
  button, input, #typing, #join { touch-action: manipulation; }
  .screen.on { display: block; }

  #join.on { display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 16px; text-align: center; }
  #join h1 { margin: 0; font-size: 24px; }
  #code { width: 6em; padding: 8px; border: 2px solid #577277; border-radius: 0; background: #000;
      color: var(--fg); font: 700 32px monospace; letter-spacing: 0.25em; text-align: center;
      text-transform: uppercase; -webkit-user-select: text; user-select: text; }
  #name { width: 9em; padding: 8px; border: 2px solid #577277; border-radius: 0; background: #000;
      color: var(--fg); font: 700 22px system-ui, sans-serif; text-align: center; -webkit-user-select: text; user-select: text; }
  #join-btn { padding: 12px 36px; border: 0; border-radius: 0; background: #cf573c; color: #fff;
      font: 700 20px system-ui, sans-serif; }
  #msg { min-height: 1.3em; color: #e8c170; }

  #stick-zone { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; }
  #stick-base, #stick-knob { position: absolute; display: none; border-radius: 50%;
      pointer-events: none; transform: translate(-50%, -50%); }
  #stick-base { width: 140px; height: 140px; border: 3px solid var(--player); opacity: 0.6; }
  #stick-knob { width: 64px; height: 64px; background: var(--player); }

  #diamond { position: absolute; top: 50%; right: max(24px, env(safe-area-inset-right));
      width: 264px; height: 264px; transform: translateY(-50%); }
  .btn { position: absolute; width: 84px; height: 84px; display: flex; align-items: center;
      justify-content: center; border: 3px solid var(--player); border-radius: 50%;
      background: rgba(255, 255, 255, 0.06); font: 700 28px system-ui, sans-serif; }
  .btn.down { background: var(--player); color: var(--bg); }
  #btn-y { left: 90px; top: 0; }
  #btn-x { left: 0; top: 90px; }
  #btn-b { left: 180px; top: 90px; }
  #btn-a { left: 90px; top: 180px; }

  #hud { position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      font-size: 14px; opacity: 0.85; pointer-events: none; white-space: nowrap; }
  #rotate { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      background: var(--bg); font-size: 22px; }
  @media (orientation: portrait) { #rotate { display: flex; } }

  /* Text mode: typing games put a text box + Submit button on the phone. */
  #typing { position: fixed; inset: 0; z-index: 10; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; padding: 16px; background: var(--bg);
      touch-action: manipulation; }
  #typing.on { display: flex; }
  #typing-prompt { font: 700 22px system-ui, sans-serif; text-align: center; }
  #typing-input { width: min(90vw, 420px); padding: 12px; border: 3px solid var(--player); border-radius: 0;
      background: #000; color: var(--fg); font: 700 28px monospace; letter-spacing: 0.12em; text-align: center;
      text-transform: uppercase; -webkit-user-select: text; user-select: text; }
  #typing-submit { width: min(90vw, 420px); padding: 16px; border: 0; border-radius: 0;
      background: var(--player); color: var(--bg); font: 800 24px system-ui, sans-serif; }
  #typing-note { min-height: 1.3em; color: #e8c170; font-size: 18px; text-align: center; }
  #typing-hint { opacity: 0.6; font-size: 14px; }
  /* Phones only open the keyboard after a tap (a page can't open it by
     itself), so a big blinking button asks for that tap. */
  #typing-tap { width: min(90vw, 420px); padding: 18px; border-radius: 0; background: var(--player);
      color: #000; font: 800 24px system-ui, sans-serif; text-align: center; animation: blink 1s infinite; }
  #typing.typing-active #typing-tap { display: none; }
  @keyframes blink { 50% { opacity: 0.55; } }
  #version { position: fixed; right: 6px; bottom: 4px; font-size: 11px; opacity: 0.4; pointer-events: none; z-index: 20; }
</style>
</head>
<body>
<div id="join" class="screen on">
  <h1>Poke Party</h1>
  <div>Enter the code on the big screen</div>
  <input id="code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
  <input id="name" maxlength="8" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="go" placeholder="Your name">
  <button id="join-btn">Join</button>
  <div id="msg"></div>
</div>

<div id="pad" class="screen">
  <div id="stick-zone"></div>
  <div id="stick-base"></div>
  <div id="stick-knob"></div>
  <div id="diamond">
    <div class="btn" id="btn-y">Y</div>
    <div class="btn" id="btn-x">X</div>
    <div class="btn" id="btn-b">B</div>
    <div class="btn" id="btn-a">A</div>
  </div>
  <div id="hud"><span id="status">Connecting...</span> · <span id="ping">-- ms</span></div>
  <div id="rotate">Turn your phone sideways</div>
</div>

<div id="typing">
  <div id="typing-prompt">Type your answer</div>
  <div id="typing-tap">TAP HERE TO TYPE</div>
  <input id="typing-input" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="send">
  <button id="typing-submit">Submit</button>
  <div id="typing-note"></div>
  <div id="typing-hint">Tap the box to bring up your keyboard</div>
</div>

<div id="version">controller v6</div>
<script>
// ---------------------------------------------------------------- settings
const RELAY = "wss://barrelofmonkeys.cyberdetective.workers.dev";
const ICE_SERVERS = [{ urls: "stun:stun.l.google.com:19302" }];
const TICK_MS = 16;          // ~60 checks a second
const RELAY_MIN_MS = 33;     // over the relay: at most ~30 updates a second, only on change
const PING_MS = 1000;        // measure ping once a second (doubles as a keepalive)
const MIN_PRESS_MS = 60;     // super-quick taps stay "down" this long so the game sees them
const DEADZONE = 0.12;
const STICK_RADIUS = 60;     // px of thumb travel for a full push

// ---------------------------------------------------------------- state
const $ = (id) => document.getElementById(id);
const state = { x: 0, y: 0, b: 0 };  // b bits: 1 move1, 2 move2, 4 move3, 8 confirm, 16 back
let ws = null, room = "", retryTimer = 0, playerText = "";
let lastKey = "", lastRelayAt = 0, lastPingAt = 0, ping = null;
let pc = null, dc = null, direct = false, noDirect = false, remoteReady = false, pendingIce = [];

// A stable id for this phone, so a dropped connection rejoins as the same player.
function makeId() {
  return Array.from(crypto.getRandomValues(new Uint8Array(10)), (n) => (n % 36).toString(36)).join("");
}
let phoneId = makeId();
try {
  phoneId = localStorage.getItem("sp-phone-id") || phoneId;
  localStorage.setItem("sp-phone-id", phoneId);
} catch (e) { /* private browsing: a fresh id each visit is fine */ }

const codeFromUrl = new URLSearchParams(location.search).get("r");
if (codeFromUrl) $("code").value = codeFromUrl.toUpperCase();

// ---------------------------------------------------------------- joining
$("join-btn").addEventListener("click", join);
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") { if ($("name").value) join(); else $("name").focus(); } });
$("name").addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });
try { $("name").value = localStorage.getItem("sp-name") || ""; } catch (e) {}

// The name goes to the game as a "sig" message, like typed answers.
function sendName() {
  const text = $("name").value.trim();
  if (text) sendRelay({ t: "sig", kind: "name", text });
}

function join() {
  room = $("code").value.trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(room)) { $("msg").textContent = "Codes are 4 letters."; return; }
  $("code").blur();
  $("name").blur();
  try { localStorage.setItem("sp-name", $("name").value.trim()); } catch (e) {}
  resetZoom();
  $("join").classList.remove("on");
  $("pad").classList.add("on");
  if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(() => {});
  }
  keepAwake();
  connect();
}

function backToJoin(text) {
  room = "";
  clearTimeout(retryTimer);
  closeDirect();
  $("pad").classList.remove("on");
  $("join").classList.add("on");
  $("msg").textContent = text;
}

async function keepAwake() {
  try { await navigator.wakeLock.request("screen"); } catch (e) { /* unsupported: fine */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !room) return;
  keepAwake();
  if (!ws) connect();
});

// ---------------------------------------------------------------- relay connection
function setStatus(text) { $("status").textContent = text; }

function showLink() {
  $("ping").textContent = `${direct ? "direct" : "relay"} · ${ping === null ? "--" : ping} ms`;
}

function sendRelay(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function connect() {
  clearTimeout(retryTimer);
  setStatus("Connecting...");
  ws = new WebSocket(`${RELAY}/phone?room=${room}&id=${phoneId}`);
  ws.onopen = () => {
    lastKey = "";
    setStatus(playerText || "Connected");
    sendName();
    if (!direct) startDirect();
  };
  ws.onmessage = (e) => onGameMessage(e.data);
  ws.onclose = (e) => {
    ws = null;
    if (!room) return;
    if (e.code === 4004) return backToJoin("No game with that code. Check the big screen.");
    if (e.code === 4005) return backToJoin("That game is full.");
    if (e.code === 4000) return setStatus("Controller opened in another tab.");
    if (e.code === 4002) closeDirect();  // the game itself closed
    setStatus(e.code === 4002 ? "Game closed. Waiting for it..." : "Connection lost. Reconnecting...");
    retryTimer = setTimeout(connect, 2000);
  };
}

// Messages from the game arrive here, over the relay or the direct link.
function onGameMessage(text) {
  let d;
  try { d = JSON.parse(text); } catch (err) { return; }
  if (d.slot) { playerText = d.name ? `${d.name} (P${d.slot})` : `You are P${d.slot}`; setStatus(playerText); }
  if (typeof d.note === "string") { playerText = d.note; setStatus(d.note); }
  if (d.color) document.documentElement.style.setProperty("--player", "#" + d.color);
  if (typeof d.pong === "number") { ping = Date.now() - d.pong; showLink(); }
  if (d.rtc === "off") { noDirect = true; closeDirect(); }  // this game build can't go direct
  if (d.type === "answer" && pc) {
    pc.setRemoteDescription({ type: "answer", sdp: d.sdp })
      .then(() => { remoteReady = true; pendingIce.forEach(addIce); pendingIce = []; })
      .catch(closeDirect);
  }
  if (d.ice && pc) {
    if (remoteReady) addIce(d.ice); else pendingIce.push(d.ice);
  }
  if ("text_mode" in d) { if (d.text_mode) openTyping(d.text_mode); else closeTyping(); }
  if (typeof d.text_note === "string") $("typing-note").textContent = d.text_note;
}

// ---------------------------------------------------------------- text mode (typing games)
// The game asks for text with {text_mode: {prompt, max, secret}} and closes it with
// {text_mode: false}. Typed words go back as {t:"sig", kind:"text", text}: the relay
// passes "sig" messages straight to the game, so no relay change was needed.
function openTyping(cfg) {
  const input = $("typing-input");
  $("typing-prompt").textContent = cfg.prompt || "Type your answer";
  input.maxLength = cfg.max || 12;
  // free = a sentence (Fake Dex Entry); otherwise one word in capitals.
  input.style.textTransform = cfg.free ? "none" : "uppercase";
  input.style.letterSpacing = cfg.free ? "normal" : "0.12em";
  input.style.fontSize = cfg.free ? "18px" : "28px";
  input.setAttribute("autocapitalize", cfg.free ? "sentences" : "characters");
  input.setAttribute("autocorrect", cfg.free ? "on" : "off");
  input.inputMode = /kg/i.test(cfg.prompt || "") ? "decimal" : "text";
  input.type = cfg.secret ? "password" : "text";
  input.value = "";
  $("typing-note").textContent = "";
  $("typing").classList.add("on");
  $("typing").classList.remove("typing-active");
  state.x = 0; state.y = 0; state.b = 0;  // let go of everything while typing
  flush(true);
  try { input.focus(); } catch (e) {}  // works on some phones; iPhones need the tap below
}

function closeTyping() {
  $("typing").classList.remove("on", "typing-active");
  $("typing-input").blur();
  resetZoom();  // iOS can leave the page zoomed after typing
}

function submitTyping() {
  const input = $("typing-input");
  const text = input.value.trim();
  if (!text) { input.focus(); return; }
  if (!ws || ws.readyState !== WebSocket.OPEN) { $("typing-note").textContent = "Not connected yet..."; return; }
  sendRelay({ t: "sig", kind: "text", text });
  input.value = "";
  $("typing-note").textContent = "Sent!";
  input.focus();  // keep the keyboard up for the next try
}
$("typing-submit").addEventListener("click", submitTyping);
// Any tap on the typing screen (not Submit) focuses the box: a real tap is
// what lets the phone open its keyboard.
$("typing").addEventListener("click", (e) => {
  if (e.target.id === "typing-submit") return;
  $("typing-input").focus();
});
$("typing-input").addEventListener("focus", () => $("typing").classList.add("typing-active"));
$("typing-input").addEventListener("blur", () => $("typing").classList.remove("typing-active"));
$("typing-input").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submitTyping(); } });

// ---------------------------------------------------------------- direct link (WebRTC)
// The relay only introduces phone and game; then they talk straight across the
// Wi-Fi. If that can't connect, the relay keeps working as before.
async function startDirect() {
  if (noDirect || !window.RTCPeerConnection) return;
  closeDirect();
  const myPc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  pc = myPc;
  dc = myPc.createDataChannel("input", { ordered: false, maxRetransmits: 0 });
  dc.onopen = () => { if (pc === myPc) { direct = true; showLink(); } };
  dc.onclose = () => { if (pc === myPc) { direct = false; showLink(); } };
  dc.onmessage = (e) => onGameMessage(e.data);

  let offerSent = false;
  const early = [];
  myPc.onicecandidate = (e) => {
    if (!e.candidate || !e.candidate.candidate) return;
    const ice = { media: e.candidate.sdpMid, index: e.candidate.sdpMLineIndex, name: e.candidate.candidate };
    if (offerSent) sendRelay({ t: "sig", ice }); else early.push(ice);
  };
  myPc.onconnectionstatechange = () => {
    if (pc === myPc && (myPc.connectionState === "failed" || myPc.connectionState === "closed")) closeDirect();
  };
  try {
    await myPc.setLocalDescription(await myPc.createOffer());
    sendRelay({ t: "sig", type: "offer", sdp: myPc.localDescription.sdp });
    offerSent = true;
    early.forEach((ice) => sendRelay({ t: "sig", ice }));
  } catch (err) {
    closeDirect();
  }
}

function addIce(c) {
  if (pc) pc.addIceCandidate({ candidate: c.name, sdpMid: c.media, sdpMLineIndex: c.index }).catch(() => {});
}

function closeDirect() {
  const oldPc = pc, oldDc = dc;
  pc = null;
  dc = null;
  direct = false;
  remoteReady = false;
  pendingIce = [];
  if (oldDc) { try { oldDc.close(); } catch (e) {} }
  if (oldPc) { try { oldPc.close(); } catch (e) {} }
  showLink();
}

// ---------------------------------------------------------------- sending
const round2 = (v) => Math.round(v * 100) / 100;

function flush(force) {
  const now = Date.now();
  const msg = { x: round2(state.x), y: round2(state.y), b: state.b };
  if (now - lastPingAt >= PING_MS) { msg.p = now; lastPingAt = now; }
  if (direct && dc && dc.readyState === "open") {
    // Direct: send every tick. A lost packet doesn't matter; the next one replaces it.
    try { dc.send(JSON.stringify(msg)); } catch (e) {}
    return;
  }
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  // Relay: only send changes (at most ~30 a second) plus the once-a-second ping.
  const key = `${msg.x},${msg.y},${msg.b}`;
  const due = key !== lastKey && now - lastRelayAt >= RELAY_MIN_MS;
  if (!force && !due && msg.p === undefined) return;
  ws.send(JSON.stringify(msg));
  lastKey = key;
  lastRelayAt = now;
}
setInterval(() => flush(false), TICK_MS);

// ---------------------------------------------------------------- joystick (appears under your thumb)
const zone = $("stick-zone"), base = $("stick-base"), knob = $("stick-knob");
let stickPointer = null, originX = 0, originY = 0;

zone.addEventListener("pointerdown", (e) => {
  if (stickPointer !== null) return;
  stickPointer = e.pointerId;
  zone.setPointerCapture(e.pointerId);
  originX = e.clientX;
  originY = e.clientY;
  for (const el of [base, knob]) {
    el.style.display = "block";
    el.style.left = originX + "px";
    el.style.top = originY + "px";
  }
  e.preventDefault();
});

zone.addEventListener("pointermove", (e) => {
  if (e.pointerId !== stickPointer) return;
  let dx = (e.clientX - originX) / STICK_RADIUS;
  let dy = (e.clientY - originY) / STICK_RADIUS;
  const len = Math.hypot(dx, dy);
  if (len > 1) { dx /= len; dy /= len; }
  knob.style.left = originX + dx * STICK_RADIUS + "px";
  knob.style.top = originY + dy * STICK_RADIUS + "px";
  const l = Math.min(len, 1);
  if (l < DEADZONE) { state.x = 0; state.y = 0; return; }
  const m = (l - DEADZONE) / (1 - DEADZONE);  // smooth start at the deadzone edge
  state.x = (dx / l) * m;
  state.y = (dy / l) * m;
});

function endStick(e) {
  if (e.pointerId !== stickPointer) return;
  stickPointer = null;
  state.x = 0;
  state.y = 0;
  base.style.display = "none";
  knob.style.display = "none";
}
zone.addEventListener("pointerup", endStick);
zone.addEventListener("pointercancel", endStick);

// ---------------------------------------------------------------- buttons (same layout as a gamepad)
const BITS = { a: 32 | 8, x: 1, y: 2, b: 4 | 16 };  // A = interact + confirm, X/Y/B = moves 1-3, B is also back
for (const [name, bit] of Object.entries(BITS)) {
  const el = $("btn-" + name);
  let pointer = null, downAt = 0;
  el.addEventListener("pointerdown", (e) => {
    if (pointer !== null) return;
    pointer = e.pointerId;
    el.setPointerCapture(e.pointerId);
    downAt = Date.now();
    state.b |= bit;
    el.classList.add("down");
    if (navigator.vibrate) navigator.vibrate(12);
    flush(true);
    e.preventDefault();
  });
  const release = (e) => {
    if (e.pointerId !== pointer) return;
    pointer = null;
    el.classList.remove("down");
    setTimeout(() => {
      if (pointer === null) { state.b &= ~bit; flush(true); }
    }, Math.max(0, MIN_PRESS_MS - (Date.now() - downAt)));
  };
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
}

// ---------------------------------------------------------------- no zooming, scrolling or menus
// iOS Safari ignores user-scalable=no, so block zoom gestures directly:
// pinch (gesture*), double-tap (dblclick + a second quick touchend), and
// if a zoom ever slips through, resetZoom() snaps it back to 1x.
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });
// The pad swallows every raw touch: no double-tap zoom, no pinch, no scroll.
// (The stick and buttons use pointer events, which still arrive.)
$("pad").addEventListener("touchstart", (e) => e.preventDefault(), { passive: false });
$("pad").addEventListener("touchend", (e) => e.preventDefault(), { passive: false });
document.addEventListener("touchstart", (e) => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
for (const g of ["gesturestart", "gesturechange", "gestureend"]) document.addEventListener(g, (e) => e.preventDefault(), { passive: false });
document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
document.addEventListener("contextmenu", (e) => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener("touchend", (e) => {
  const now = Date.now();
  const t = e.target;
  const typing = t.id === "typing-input" || t.id === "typing-submit" || t.id === "typing-tap" || t.id === "typing";
  if (now - lastTouchEnd < 350 && !typing) e.preventDefault();  // 2nd quick tap = no zoom
  lastTouchEnd = now;
}, { passive: false });

function resetZoom() {
  const meta = $("viewport");
  const content = "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover";
  meta.setAttribute("content", content + ", minimum-scale=1");
  setTimeout(() => meta.setAttribute("content", content), 50);
  window.scrollTo(0, 0);
}
window.addEventListener("orientationchange", () => setTimeout(resetZoom, 200));
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", () => {
    if (window.visualViewport.scale > 1.01 && !$("typing").classList.contains("typing-active")) resetZoom();
  });
}
</script>
</body>
</html>
